services:
  painel-rotativo:
    image: ghcr.io/sidneycavalcanti/rotativo-move:latest   # publicada pelo GitHub Actions a cada push na main
    build: .                                                # sem acesso ao registry: "docker compose up -d --build" constroi aqui
    container_name: painel-rotativo
    restart: unless-stopped
    ports:
      - "${PORTA:-8080}:3000"
    environment:
      - CAFE_URL=${CAFE_URL:-}  # link do botao "Me pague um cafe" (vazio = sem botao)
      - PIX_CHAVE=${PIX_CHAVE:-}  # chave Pix mostrada na janela do cafe (vazio = sem Pix)
    mem_limit: 64m   # so entrega a pagina: configuracao e midia ficam no navegador de cada pessoa
